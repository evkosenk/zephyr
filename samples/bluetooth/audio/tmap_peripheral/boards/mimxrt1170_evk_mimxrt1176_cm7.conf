CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y
CONFIG_AUDIO_CODEC_WM8962=y
CONFIG_I2S=y
CONFIG_I2S_MCUX_SAI=y
CONFIG_FPU=y
CONFIG_MODULES=y
CONFIG_LIBLC3=y
CONFIG_BT_ISO_TX_BUF_COUNT=8

# LC3 decoding runs in the Bluetooth receive thread.
CONFIG_MAIN_STACK_SIZE=2304
CONFIG_BT_LONG_WQ_STACK_SIZE=1600
CONFIG_BT_RX_STACK_SIZE=8192
CONFIG_BT_ISO_RX_MTU=310
CONFIG_BT_ISO_RX_BUF_COUNT=20

# Phone Enable metadata includes both a streaming context and a CCID list.
CONFIG_BT_AUDIO_CODEC_CFG_MAX_METADATA_SIZE=20

# Accept phone-initiated playback without the sample's timed call/media commands.
CONFIG_BT_TBS_CLIENT_GTBS=n
CONFIG_BT_TBS_CLIENT_TBS=n
CONFIG_BT_TBS_CLIENT_ORIGINATE_CALL=n
CONFIG_BT_TBS_CLIENT_TERMINATE_CALL=n
CONFIG_BT_TBS_CLIENT_BEARER_URI_SCHEMES_SUPPORTED_LIST=n
CONFIG_BT_MCC=n
